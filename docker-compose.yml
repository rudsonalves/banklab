services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres/Dockerfile
    restart: always
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${DB_NAME:-bank}
      - -c
      - cron.timezone=America/Sao_Paulo
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bank}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bank}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-api/dev.env}
    environment:
      ENV_FILE: /app/config/runtime.env
    volumes:
      - ./${API_ENV_FILE:-api/dev.env}:/app/config/runtime.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PUBLISHED_HOST:-127.0.0.1}:${API_PUBLISHED_PORT:-8080}:8080"

volumes:
  pgdata:
