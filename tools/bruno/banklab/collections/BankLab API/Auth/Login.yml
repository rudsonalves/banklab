info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: X-App-Token
      value: "{{app_token}}"
    - name: Content-Type
      value: application/json
    - name: X-Installation-Id
      value: ""
  body:
    type: json
    data: |-
      {
        "email": "{{user_email}}",
        "password": "{{user_pass}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
