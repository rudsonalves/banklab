info:
  name: Login admin
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: X-App-Token
      value: "{{app_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{admin_email}}",
        "password": "{{admin_pass}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
