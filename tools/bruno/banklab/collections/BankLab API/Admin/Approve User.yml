info:
  name: Approve User
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/admin/users/{{id}}/approve"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
